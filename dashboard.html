<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Faturas - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="config.js"></script>

    <script>
        if (!sessionStorage.getItem('supabase_token')) {
            window.location.href = 'index.html';
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen antialiased">

    <header class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 py-2 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <img src="logo.png" alt="Logo" class="h-8 object-contain">
                <h1 class="text-xl font-bold text-gray-800 tracking-tight">Gestão de Faturas</h1>
            </div>

            <div class="flex items-center justify-between w-full sm:w-auto gap-6 text-sm">
                <div class="text-right hidden sm:block leading-tight">
                    <span class="block font-semibold text-gray-700" id="user-email-display">Utilizador Ativo</span>
                    <span class="block text-[10px] text-emerald-500 font-medium flex items-center justify-end gap-1">
                        <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Sessão Ativa
                    </span>
                </div>
                <button id="btn-logout" class="bg-gray-100 hover:bg-red-50 hover:text-red-600 text-gray-700 px-3 py-1 rounded-lg transition-all duration-200 text-sm font-bold flex items-center gap-2 border border-transparent hover:border-red-100">
                    <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                    Sair
                </button>
            </div>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-4 space-y-4">
        
        <section class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-2 border-b border-gray-50 grid grid-cols-1 lg:grid-cols-3 items-center gap-4">
                
                <div class="flex items-center gap-4">
                    <div class="hidden xl:flex items-center gap-2 shrink-0">
                        <div class="bg-blue-50 p-1.5 rounded-lg">
                            <i data-lucide="list" class="w-4 h-4 text-blue-600"></i>
                        </div>
                    </div>
                    <div class="relative w-full">
                        <span class="absolute inset-y-0 left-0 pl-2.5 flex items-center text-gray-400">
                            <i data-lucide="search" class="w-3.5 h-3.5"></i>
                        </span>
                        <input type="text" id="filter-desc" placeholder="Pesquisar descrição..." 
                            class="w-full pl-8 pr-3 py-1.5 text-xs border border-gray-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all">
                    </div>
                </div>

                <div class="flex items-center justify-center gap-1.5">
                    <select id="filter-estado" class="text-xs border border-gray-200 rounded p-1.5 outline-none focus:ring-1 focus:ring-blue-500 bg-white min-w-[110px]">
                        <option value="">Todos Estados</option>
                        <option value="pendente">Pendente</option>
                        <option value="correcto">Correcto</option>
                    </select>
                    <input type="number" id="filter-ano" placeholder="Ano" class="w-16 text-xs border border-gray-200 rounded p-1.5 outline-none focus:ring-1 focus:ring-blue-500">
                    <input type="number" id="filter-mes" min="1" max="12" placeholder="Mês" class="w-14 text-xs border border-gray-200 rounded p-1.5 outline-none focus:ring-1 focus:ring-blue-500">
                    <button id="btn-filtrar" class="bg-gray-900 hover:bg-black text-white px-4 py-1.5 rounded text-xs font-medium transition-colors">
                        Filtrar
                    </button>
                    <button id="btn-limpar-filtro" class="text-gray-400 hover:text-red-500 p-1" title="Limpar">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    </button>
                </div>

                <div class="flex items-center justify-end gap-2">
                    <div class="flex items-center gap-2 bg-gray-50 p-1 rounded-lg border border-gray-100">
                        <span id="page-info" class="text-[9px] text-gray-500 font-bold uppercase px-1">Pág. 1</span>
                        <div class="flex gap-0.5">
                            <button id="prev-page" class="p-1 rounded bg-white border border-gray-200 hover:bg-gray-50 disabled:opacity-30">
                                <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
                            </button>
                            <button id="next-page" class="p-1 rounded bg-white border border-gray-200 hover:bg-gray-50 disabled:opacity-30">
                                <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="overflow-x-auto overflow-y-auto max-h-[650px]">
                <table class="w-full text-left border-collapse table-fixed">
                    <thead class="bg-gray-50 text-gray-500 text-[10px] uppercase tracking-wider sticky top-0 z-10 border-b border-gray-100">
                        <tr>
                            <th class="w-[10%] px-4 py-1.5 font-bold">Data Valor</th>
                            <th class="w-[25%] px-4 py-1.5 font-bold">Descrição</th>
                            <th class="w-[12%] px-4 py-1.5 font-bold text-right">Montante</th>
                            <th class="w-[15%] px-4 py-1.5 font-bold">Notas</th>
                            <th class="w-[20%] px-4 py-1.5 font-bold">Documentos</th>
                            <th class="w-[12%] px-4 py-1.5 font-bold text-center">Estado</th>
                            <th class="w-[6%] px-4 py-1.5 font-bold text-center">Ver</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-50 text-sm">
                    </tbody>
                </table>
            </div>
        </section>

        <section id="form-section" class="bg-white rounded-xl shadow-sm border border-gray-100 p-3">
            <div class="flex items-center gap-2 mb-2 border-b border-gray-50 pb-1">
                <i data-lucide="clipboard-list" class="w-4 h-4 text-blue-500"></i>
                <h2 class="text-sm font-bold text-gray-800">Detalhes do Registo</h2>
            </div>
            
            <div id="form-container" class="border-2 border-dashed border-gray-50 rounded-xl min-h-[80px] flex flex-col items-center justify-center text-gray-300 bg-gray-50/30">
                <p class="text-[10px] font-bold uppercase tracking-widest text-center">Selecione um registo</p>
            </div>
        </section>

    </main>

    <script src="dashboard.js"></script>
</body>
</html>
